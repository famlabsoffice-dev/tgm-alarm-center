name: Billing Security Gate

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'app.js'
      - 'src/domain/pricing.ts'
      - 'src/billing/**'
      - 'scripts/harden-web-billing.mjs'
      - 'tests/billing-security.test.mjs'
      - '.github/workflows/billing-security-gate.yml'

permissions:
  contents: write

jobs:
  billing-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: Harden legacy client bypass
        run: node scripts/harden-web-billing.mjs

      - name: Verify billing security gate
        run: node --test tests/billing-security.test.mjs

      - name: Commit deterministic hardening
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          if git diff --quiet -- app.js; then
            echo 'No hardening changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'security: enforce verified billing entitlements [billing-hardening]'
          git push origin "HEAD:${TARGET_BRANCH}"
