name: TGM Release Verification
run-name: TGM Release Verification · ${{ github.sha }}

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgm-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Bootstrap pinned Playwright for browser smoke
        run: |
          npx --yes --package=playwright@1.62.1 playwright --version
          npx --yes --package=playwright@1.62.1 playwright install chromium

      - name: Run canonical local-equivalent release verification
        run: pnpm run verify:release
        env:
          CI: true
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload packaged web evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tgm-release-verification-${{ github.sha }}
          path: dist/web/BUILD-MANIFEST.json
          if-no-files-found: ignore
