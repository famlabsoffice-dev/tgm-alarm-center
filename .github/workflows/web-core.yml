name: TGM ALARM CENTER validation

on:
  push:
    branches: ["main", "feature/**", "agent/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests and repository gates
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Validate Expo configuration
        run: pnpm exec expo config --type public --json > /tmp/tgm-expo-config.json
      - name: Check working-tree whitespace
        run: git diff --check
      - name: Upload Expo configuration
        uses: actions/upload-artifact@v4
        with:
          name: expo-config
          path: /tmp/tgm-expo-config.json
          if-no-files-found: error
