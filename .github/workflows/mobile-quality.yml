name: mobile-quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgm-mobile-quality
  cancel-in-progress: true

jobs:
  mobile-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Domain and repository tests
        run: pnpm test

      - name: Native device matrix gate
        run: pnpm verify:native-device-matrix

      - name: Android reliability contract
        run: pnpm verify:android-reliability

      - name: Mobile configuration gate
        run: pnpm verify:mobile-build

      - name: Store configuration gate
        run: pnpm verify:store-config

      - name: Expo configuration validation
        run: pnpm exec expo config --type public
