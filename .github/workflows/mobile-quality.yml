name: mobile-quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.15.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Domain and repository tests
        run: pnpm test

      - name: Mobile configuration gate
        run: pnpm verify:mobile-build

      - name: Store configuration gate
        run: pnpm verify:store-config

      - name: Expo configuration validation
        run: pnpm exec expo config --type public
