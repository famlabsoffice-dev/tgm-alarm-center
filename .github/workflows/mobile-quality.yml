name: mobile-quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tgm-mobile-quality
  cancel-in-progress: true

jobs:
  mobile-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Install exact pnpm toolchain
        run: |
          npm install --global pnpm@10.15.1
          pnpm --version

      - name: Resolve Expo SDK dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Align Expo-managed dependencies
        run: pnpm exec expo install expo@57.0.17 react-native@0.86.3 && pnpm exec expo install --fix

      - name: Expo Doctor
        run: pnpm dlx expo-doctor@latest

      - name: Clean native prebuild
        run: pnpm exec expo prebuild --clean --non-interactive

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Domain and repository tests
        run: pnpm test

      - name: Native device matrix gate
        run: pnpm verify:native-device-matrix

      - name: Android reliability contract
        run: pnpm verify:android-reliability

      - name: Mobile configuration gate
        run: pnpm verify:mobile-build

      - name: Store configuration gate
        run: pnpm verify:store-config

      - name: Expo configuration validation
        run: pnpm exec expo config --type public

      - name: Persist verified dependency graph
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo 'Dependency graph already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git commit -m 'chore: lock verified Expo SDK 57 dependency graph'
          git push
