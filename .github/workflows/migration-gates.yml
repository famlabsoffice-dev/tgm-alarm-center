name: TGM Migration Gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgm-migration-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-preflight:
    name: Migration preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Run database-neutral migration status and preflight
        run: pnpm run verify:migrations
        env:
          CI: true
          TGM_BACKEND_ENABLED: "0"
