name: TGM Regression Full Suite

run-name: TGM Regression Full Suite · ${{ github.sha }}

on:
  push:
    branches: ["main", "fix/**", "regression/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgm-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Full-suite release contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Bootstrap pinned Playwright for browser smoke
        run: |
          npx --yes --package=playwright@1.62.1 playwright --version
          npx --yes --package=playwright@1.62.1 playwright install chromium

      - name: Run regression full-suite release contract
        run: pnpm run verify:regression
        env:
          CI: true
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload regression evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tgm-regression-${{ github.sha }}
          path: |
            dist/web/BUILD-MANIFEST.json
            test-results/**
          if-no-files-found: ignore
