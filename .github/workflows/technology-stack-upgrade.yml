name: technology-stack-upgrade

on:
  push:
    branches: [main]
    paths:
      - package.json
      - config/tech-stack-target.json
      - .github/workflows/technology-stack-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tgm-technology-stack-upgrade
  cancel-in-progress: true

jobs:
  upgrade-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Install exact pnpm toolchain
        run: |
          npm install --global pnpm@10.15.1
          pnpm --version

      - name: Resolve and normalize dependency graph
        run: |
          pnpm install --no-frozen-lockfile
          pnpm exec expo install expo@57.0.17 react-native@0.86.3
          pnpm exec expo install --fix
          pnpm install --lockfile-only

      - name: Run Expo compatibility diagnostics
        run: pnpm dlx expo-doctor@latest

      - name: Rebuild native projects from clean state
        run: pnpm exec expo prebuild --clean --non-interactive

      - name: Validate native build inputs
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm verify:android-reliability
          pnpm verify:mobile-build
          pnpm verify:store-config

      - name: Persist verified dependency lock
        shell: bash
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo 'Dependency metadata already matches the verified target.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git commit -m 'chore: persist verified dependency graph'
          git push origin main
