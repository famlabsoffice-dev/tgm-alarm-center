name: technology-upgrade

on:
  push:
    branches: [main]
    paths:
      - config/tech-stack-target.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tgm-technology-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Install exact pnpm toolchain
        run: |
          npm install --global pnpm@10.15.1
          pnpm --version

      - name: Read target baseline
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const target = JSON.parse(fs.readFileSync('config/tech-stack-target.json', 'utf8'));
          for (const key of ['expoSdk', 'react', 'reactNative', 'node', 'typescript', 'eslint']) {
            if (typeof target[key] !== 'string' || target[key].length === 0) throw new Error(`Invalid technology target: ${key}`);
          }
          console.log(JSON.stringify(target, null, 2));
          NODE

      - name: Install target core toolchain
        run: |
          TARGET=$(node -p "JSON.parse(require('fs').readFileSync('config/tech-stack-target.json','utf8')).expoSdk")
          REACT=$(node -p "JSON.parse(require('fs').readFileSync('config/tech-stack-target.json','utf8')).react")
          RN=$(node -p "JSON.parse(require('fs').readFileSync('config/tech-stack-target.json','utf8')).reactNative")
          TS=$(node -p "JSON.parse(require('fs').readFileSync('config/tech-stack-target.json','utf8')).typescript")
          ESLINT=$(node -p "JSON.parse(require('fs').readFileSync('config/tech-stack-target.json','utf8')).eslint")
          pnpm add --save-exact "expo@$TARGET" "react@$REACT" "react-native@$RN"
          pnpm add --save-dev --save-exact "typescript@$TS" "eslint@$ESLINT"

      - name: Align all Expo dependencies
        run: |
          pnpm exec expo install --fix
          pnpm install --lockfile-only

      - name: Doctor
        run: pnpm dlx expo-doctor@latest

      - name: Clean native prebuild
        run: pnpm exec expo prebuild --clean --non-interactive

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test suite
        run: pnpm test

      - name: Store and native gates
        run: |
          pnpm verify:android-reliability
          pnpm verify:mobile-build
          pnpm verify:store-config
          pnpm exec expo config --type public

      - name: Commit verified technology upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "Technology baseline already synchronized."
            exit 0
          fi
          git status --short
          git add package.json pnpm-lock.yaml
          git commit -m "chore: upgrade native technology stack"
          git push
