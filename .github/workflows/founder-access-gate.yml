name: Founder Access Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  founder-access:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Founder/Team contract
        run: node scripts/verify-founder-access.mjs
