name: TGM Web Pricing Sync

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Synchronize web pricing
        run: node scripts/sync-web-pricing.mjs
      - name: Commit synchronized pricing
        run: |
          if git diff --quiet -- app.js; then
            echo "Web pricing already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "chore(pricing): synchronize web pricing with domain"
          git push
