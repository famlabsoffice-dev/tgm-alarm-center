<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<meta name="description" content="TGM ALARM CENTER – zentrale Alarm-, Kontakt-, Geräte- und Ereignisübersicht.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<title>TGM ALARM CENTER</title>
<style>
:root{--bg:#080b10;--panel:#10151d;--panel2:#151c26;--line:#27313f;--text:#f5f7fa;--muted:#8f9aaa;--accent:#d5223b;--accent2:#ff4158;--ok:#35d39a;--warn:#f3bc4a;--info:#55a9ff;--shadow:0 18px 60px rgba(0,0,0,.34);--r:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 20% -10%,rgba(213,34,59,.12),transparent 32%),radial-gradient(circle at 100% 0,rgba(85,169,255,.08),transparent 27%),var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:min(1280px,100%);margin:auto;padding:14px 16px 60px}.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(var(--bg) 78%,transparent);backdrop-filter:blur(14px);padding-bottom:14px}.toprow{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:11px}.mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#e42f47,#9f1327);display:grid;place-items:center;box-shadow:0 11px 35px rgba(213,34,59,.28);font-weight:1000;font-size:20px}.brand b{display:block;font-size:16px;letter-spacing:.02em}.brand span{display:block;color:var(--muted);font-size:12px}.connection{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:rgba(12,16,22,.76);padding:8px 11px;border-radius:999px;font-size:11px;color:#c3cbd5}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(53,211,154,.08)}.nav{display:flex;gap:8px;overflow:auto;padding-top:11px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 14px;border-radius:11px;font-weight:800;white-space:nowrap}.nav button.active{background:#171d27;border-color:#2d3644;color:#fff}.nav button:hover{color:#fff;background:#141a22}.grid{display:grid;gap:14px}.g2{grid-template-columns:1.45fr .75fr}.g3{grid-template-columns:repeat(3,1fr)}.card{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.008)),var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.pad{padding:21px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:#7f8a9a;font-size:10px;font-weight:900}.muted{color:var(--muted)}.small{font-size:12px}.hero{padding:24px}.heroRow{display:flex;gap:20px;align-items:stretch}.heroMain{flex:1}.heroSide{width:270px;display:grid;gap:12px}.hero h1{font-size:34px;line-height:1.08;margin:8px 0 10px}.hero p{margin:0;color:#aeb7c3;max-width:760px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid transparent;border-radius:12px;padding:11px 15px;font-weight:850}.primary{background:var(--accent);color:#fff;box-shadow:0 10px 30px rgba(213,34,59,.22)}.primary:hover{background:var(--accent2)}.secondary{background:#202733;border-color:#303b49;color:#eef2f7}.secondary:hover{background:#28313e}.ghost{background:transparent;color:#ced6e0;border-color:#2c3542}.danger{background:#3a1d25;border-color:#66313d;color:#ffb4bf}.stat{padding:18px}.statTop{display:flex;justify-content:space-between;align-items:center;gap:10px}.icon{width:40px;height:40px;border-radius:12px;background:#242b36;display:grid;place-items:center;color:#fff;font-size:19px}.statValue{font-size:29px;font-weight:950;margin-top:12px}.statLabel{color:var(--muted);font-size:12px}.status{font-size:11px;padding:5px 8px;border-radius:999px;font-weight:900;border:1px solid #334050;background:#171e28;color:#bdc6d0}.status.active{border-color:#6b2533;background:#2b1820;color:#ffafb9}.status.ok{border-color:#1d5f49;background:#13271f;color:#8af0c8}.status.warn{border-color:#634d26;background:#2c2516;color:#f7d277}.status.info{border-color:#254e78;background:#152334;color:#9bcaff}.list{display:grid;gap:9px}.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);background:#0e141b;border-radius:14px}.rowMain{flex:1;min-width:0}.rowMain strong{display:block}.rowMain small{display:block;margin-top:3px;color:#7f8b9d}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#111720;color:#c9d0d8;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900}.alarm{position:relative;overflow:hidden}.alarm::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent)}.alarmBody{padding:17px}.alarmTitle{display:flex;justify-content:space-between;gap:12px}.alarm h3{margin:6px 0 4px;font-size:17px}.alarm p{margin:0;color:#a6b0bd}.alarmFoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px}.meter{height:8px;border-radius:999px;background:#252d38;overflow:hidden;margin-top:10px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#b4162d,#e83a50);border-radius:inherit}.field{display:grid;gap:7px;margin-top:13px}.field label{font-size:11px;font-weight:850;color:#c4ccd6}.field input,.field select,.field textarea{width:100%;background:#0d131a;color:#fff;border:1px solid #313b49;border-radius:12px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7b2a38;box-shadow:0 0 0 3px rgba(213,34,59,.12)}.modalWrap{position:fixed;inset:0;background:rgba(2,4,7,.78);backdrop-filter:blur(8px);z-index:100;display:grid;place-items:center;padding:16px}.modal{width:min(640px,100%);max-height:90vh;overflow:auto;background:#151b24;border:1px solid #303a48;border-radius:20px;box-shadow:0 30px 100px rgba(0,0,0,.55);padding:22px}.modalHead{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal h3{margin:0;font-size:21px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,130px);opacity:0;transition:.25s;z-index:200;background:#171e28;border:1px solid #3a4656;color:#fff;padding:12px 15px;border-radius:13px;box-shadow:0 18px 45px rgba(0,0,0,.45);max-width:92vw;text-align:center}.toast.show{transform:translate(-50%,0);opacity:1}.empty{text-align:center;padding:32px 15px;color:var(--muted)}.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;color:#6e798a;font-size:10px}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}.heroRow{flex-direction:column}.heroSide{width:auto;grid-template-columns:repeat(2,1fr)}}
@media(orientation:portrait) and (max-width:900px){body::before{content:"Für TGM ALARM CENTER bitte das Gerät ins Querformat drehen.";position:fixed;inset:0;z-index:1000;background:#070a0f;color:#fff;display:grid;place-items:center;text-align:center;padding:30px;font-weight:900;font-size:20px}.app{display:none}}
@media(max-width:560px){.app{padding:10px 10px 45px}.hero{padding:19px}.hero h1{font-size:27px}.heroSide{grid-template-columns:1fr 1fr}.stat{padding:15px}.pad{padding:17px}.actions .btn{flex:1 1 auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div><div id="modalRoot"></div><div id="toast" class="toast"></div>
<script>
'use strict';
const STORAGE='tgm-alarm-center-v1', VERSION='1.0.0', iso=()=>new Date().toISOString(), id=()=>crypto.randomUUID?.()||('id-'+Date.now()+'-'+Math.random().toString(16).slice(2));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=ts=>new Intl.DateTimeFormat('de-DE',{dateStyle:'short',timeStyle:'medium'}).format(new Date(ts));
function baseState(){return{version:1,profile:{name:'TGM Leitstelle'},alarms:[{id:id(),title:'Systembereitschaft',source:'TGM Core',severity:'low',status:'active',createdAt:iso(),ackAt:null,notes:'Interne Bereitschaftsprüfung'},{id:id(),title:'Perimeter-Sensor Nord',source:'Sensor N-04',severity:'high',status:'resolved',createdAt:new Date(Date.now()-3600000).toISOString(),ackAt:new Date(Date.now()-3540000).toISOString(),resolvedAt:new Date(Date.now()-3200000).toISOString(),notes:'Signal nach Prüfung zurückgesetzt'}],contacts:[{id:id(),name:'Leitstellenleitung',role:'Primärkontakt',phone:'+49 000 000000',active:true},{id:id(),name:'Technischer Bereitschaftsdienst',role:'Technik',phone:'+49 000 000001',active:true}],devices:[{id:id(),name:'Gateway Alpha',type:'Gateway',state:'online',lastSeen:iso()},{id:id(),name:'Sensor N-04',type:'Sensor',state:'online',lastSeen:new Date(Date.now()-50000).toISOString()},{id:id(),name:'Sensor W-12',type:'Sensor',state:'offline',lastSeen:new Date(Date.now()-7200000).toISOString()}],events:[{id:id(),ts:iso(),type:'system',text:'TGM ALARM CENTER gestartet'}],settings:{sound:false,autoRefresh:true}}}
function load(){try{const raw=localStorage.getItem(STORAGE);if(!raw)return baseState();const s=JSON.parse(raw),b=baseState();return{...b,...s,profile:{...b.profile,...(s.profile||{})},settings:{...b.settings,...(s.settings||{})}}}catch{return baseState()}}
let state=load(),view='overview';
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))} function log(type,text){state.events.unshift({id:id(),ts:iso(),type,text});if(state.events.length>250)state.events.length=250;save()} function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400)}
function statusLabel(s){return s==='active'?'AKTIV':s==='ack'?'BESTÄTIGT':s==='resolved'?'ERLEDIGT':'UNBEKANNT'} function sevLabel(s){return s==='high'?'HOCH':s==='medium'?'MITTEL':'NIEDRIG'} function severityClass(s){return s==='high'?'active':s==='medium'?'warn':'info'}
function openModal(kind,data={}){let title='',html='';if(kind==='alarm'){title=data.id?'Alarm bearbeiten':'Alarm auslösen';html=`<div class="field"><label>TITEL</label><input id="aTitle" value="${esc(data.title||'')}" maxlength="100"></div><div class="field"><label>QUELLE</label><input id="aSource" value="${esc(data.source||'Manueller Eingang')}" maxlength="100"></div><div class="field"><label>PRIORITÄT</label><select id="aSeverity"><option value="high" ${data.severity==='high'?'selected':''}>Hoch</option><option value="medium" ${data.severity==='medium'?'selected':''}>Mittel</option><option value="low" ${(!data.severity||data.severity==='low')?'selected':''}>Niedrig</option></select></div><div class="field"><label>NOTIZ</label><textarea id="aNotes" rows="4" maxlength="1000">${esc(data.notes||'')}</textarea></div><div class="actions"><button class="btn primary" onclick="saveAlarm('${data.id||''}')">${data.id?'Speichern':'Alarm auslösen'}</button><button class="btn secondary" onclick="closeModal()">Abbrechen</button></div>`}else if(kind==='contact'){title=data.id?'Kontakt bearbeiten':'Kontakt anlegen';html=`<div class="field"><label>NAME</label><input id="cName" value="${esc(data.name||'')}" maxlength="100"></div><div class="field"><label>ROLLE</label><input id="cRole" value="${esc(data.role||'')}" maxlength="80"></div><div class="field"><label>TELEFON</label><input id="cPhone" value="${esc(data.phone||'')}" maxlength="40" inputmode="tel"></div><div class="actions"><button class="btn primary" onclick="saveContact('${data.id||''}')">Speichern</button><button class="btn secondary" onclick="closeModal()">Abbrechen</button></div>`}else if(kind==='device'){title=data.id?'Gerät bearbeiten':'Gerät anlegen';html=`<div class="field"><label>BEZEICHNUNG</label><input id="dName" value="${esc(data.name||'')}" maxlength="100"></div><div class="field"><label>TYP</label><input id="dType" value="${esc(data.type||'Sensor')}" maxlength="60"></div><div class="field"><label>STATUS</label><select id="dState"><option value="online" ${data.state==='online'?'selected':''}>Online</option><option value="offline" ${data.state==='offline'?'selected':''}>Offline</option><option value="maintenance" ${data.state==='maintenance'?'selected':''}>Wartung</option></select></div><div class="actions"><button class="btn primary" onclick="saveDevice('${data.id||''}')">Speichern</button><button class="btn secondary" onclick="closeModal()">Abbrechen</button></div>`}else if(kind==='settings'){title='Einstellungen';html=`<div class="row"><div class="rowMain"><strong>Akustische Hinweise</strong><small>Lokale Systemtöne bei neuen Alarmen</small></div><input id="sSound" type="checkbox" ${state.settings.sound?'checked':''}></div><div class="row" style="margin-top:9px"><div class="rowMain"><strong>Automatische Aktualisierung</strong><small>Lokale Anzeige alle 15 Sekunden aktualisieren</small></div><input id="sRefresh" type="checkbox" ${state.settings.autoRefresh?'checked':''}></div><div class="field"><label>PROFILNAME</label><input id="sName" value="${esc(state.profile.name)}" maxlength="100"></div><div class="actions"><button class="btn primary" onclick="saveSettings()">Speichern</button><button class="btn secondary" onclick="closeModal()">Abbrechen</button></div>`}else return;document.getElementById('modalRoot').innerHTML=`<div class="modalWrap" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalHead"><h3>${title}</h3><button class="btn ghost" onclick="closeModal()">✕</button></div>${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function saveAlarm(existingId){const title=document.getElementById('aTitle').value.trim(),source=document.getElementById('aSource').value.trim(),severity=document.getElementById('aSeverity').value,notes=document.getElementById('aNotes').value.trim();if(!title||!source){toast('Titel und Quelle sind erforderlich.');return}if(existingId){const a=state.alarms.find(x=>x.id===existingId);if(!a)return;a.title=title;a.source=source;a.severity=severity;a.notes=notes;log('alarm','Alarm geändert: '+title);toast('Alarm gespeichert.')}else{state.alarms.unshift({id:id(),title,source,severity,status:'active',createdAt:iso(),ackAt:null,notes});log('alarm','Alarm ausgelöst: '+title);toast('Alarm ausgelöst.')}save();closeModal();render()}
function ackAlarm(i){const a=state.alarms[i];if(!a||a.status!=='active')return;a.status='ack';a.ackAt=iso();log('alarm','Alarm bestätigt: '+a.title);save();toast('Alarm bestätigt.');render()} function resolveAlarm(i){const a=state.alarms[i];if(!a||a.status==='resolved')return;a.status='resolved';a.resolvedAt=iso();log('alarm','Alarm erledigt: '+a.title);save();toast('Alarm als erledigt markiert.');render()}
function saveContact(existingId){const name=document.getElementById('cName').value.trim(),role=document.getElementById('cRole').value.trim(),phone=document.getElementById('cPhone').value.trim();if(!name||!phone){toast('Name und Telefonnummer sind erforderlich.');return}const item={id:existingId||id(),name,role,phone,active:true};if(existingId)state.contacts=state.contacts.map(x=>x.id===existingId?item:x);else state.contacts.unshift(item);log('contact',(existingId?'Kontakt geändert: ':'Kontakt angelegt: ')+name);save();closeModal();render()} function removeContact(i){const c=state.contacts[i];if(!c)return;if(!confirm('Kontakt wirklich entfernen?'))return;state.contacts.splice(i,1);log('contact','Kontakt entfernt: '+c.name);save();render()}
function saveDevice(existingId){const name=document.getElementById('dName').value.trim(),type=document.getElementById('dType').value.trim(),deviceState=document.getElementById('dState').value;if(!name||!type){toast('Bezeichnung und Typ sind erforderlich.');return}const item={id:existingId||id(),name,type,state:deviceState,lastSeen:deviceState==='online'?iso():(state.devices.find(x=>x.id===existingId)?.lastSeen||iso())};if(existingId)state.devices=state.devices.map(x=>x.id===existingId?item:x);else state.devices.unshift(item);log('device',(existingId?'Gerät geändert: ':'Gerät angelegt: ')+name);save();closeModal();render()} function removeDevice(i){const d=state.devices[i];if(!d)return;if(!confirm('Gerät wirklich entfernen?'))return;state.devices.splice(i,1);log('device','Gerät entfernt: '+d.name);save();render()}
function saveSettings(){state.settings.sound=document.getElementById('sSound').checked;state.settings.autoRefresh=document.getElementById('sRefresh').checked;state.profile.name=document.getElementById('sName').value.trim()||'TGM Leitstelle';log('system','Einstellungen aktualisiert');save();closeModal();render();toast('Einstellungen gespeichert.')}
function exportData(){const payload={app:'TGM ALARM CENTER',version:VERSION,exportedAt:iso(),state};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='tgm-alarm-center-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800);toast('Backup exportiert.')}
function importData(){const inp=document.createElement('input');inp.type='file';inp.accept='application/json';inp.onchange=()=>{const f=inp.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(p.app!=='TGM ALARM CENTER'||!p.state)throw new Error('invalid');state=p.state;save();log('system','Backup importiert');render();toast('Backup importiert.')}catch{toast('Backup konnte nicht importiert werden.')}};r.readAsText(f)};inp.click()} function resetData(){if(!confirm('Alle lokalen TGM ALARM CENTER Daten löschen?'))return;localStorage.removeItem(STORAGE);state=baseState();save();render();toast('Lokale Daten gelöscht.')}
function nav(n){view=n;render()} function cardAlarm(a){return `<article class="card alarm"><div class="alarmBody"><div class="alarmTitle"><span class="status ${severityClass(a.severity)}">${sevLabel(a.severity)}</span><span class="status ${a.status==='active'?'active':a.status==='ack'?'warn':'ok'}">${statusLabel(a.status)}</span></div><h3>${esc(a.title)}</h3><p>${esc(a.source)} · ${fmt(a.createdAt)}</p><div class="alarmFoot"><span class="small muted">${esc(a.notes||'Keine Zusatznotiz')}</span><div class="actions" style="margin:0"><button class="btn secondary" onclick="openModal('alarm',${JSON.stringify(a).replace(/</g,'\\u003c')})">Bearbeiten</button>${a.status==='active'?`<button class="btn primary" onclick="ackAlarm(${state.alarms.indexOf(a)})">Bestätigen</button>`:''}${a.status!=='resolved'?`<button class="btn ghost" onclick="resolveAlarm(${state.alarms.indexOf(a)})">Erledigen</button>`:''}</div></div></div></article>`}
function overview(){const active=state.alarms.filter(a=>a.status!=='resolved').length,high=state.alarms.filter(a=>a.status!=='resolved'&&a.severity==='high').length,online=state.devices.filter(d=>d.state==='online').length;return `<section class="hero card"><div class="heroRow"><div class="heroMain"><div class="eyebrow">Zentrale Übersicht</div><h1>Alarmbetrieb unter Kontrolle.</h1><p>Alle aktuellen Alarme, Zuständigkeiten, Geräte und Ereignisse in einer zentralen Leitstellenansicht.</p><div class="actions"><button class="btn primary" onclick="openModal('alarm')">＋ Alarm auslösen</button><button class="btn secondary" onclick="nav('alarms')">Alarme verwalten</button><button class="btn ghost" onclick="openModal('settings')">Einstellungen</button></div></div><div class="heroSide"><div class="card stat"><div class="statTop"><span class="statLabel">Offene Alarme</span><span class="icon">!</span></div><div class="statValue">${active}</div><span class="status ${high?'active':'ok'}">${high?high+' hoch priorisiert':'keine Hochalarme'}</span></div><div class="card stat"><div class="statTop"><span class="statLabel">Gerätestatus</span><span class="icon">⌁</span></div><div class="statValue">${online}/${state.devices.length}</div><span class="status ${online===state.devices.length?'ok':'warn'}">${online===state.devices.length?'vollständig online':'Prüfung erforderlich'}</span></div></div></div></section><section class="section"><div class="sectionHead"><div><div class="eyebrow">Aktuelle Lage</div><h2>Offene Alarme</h2></div><button class="btn ghost" onclick="nav('alarms')">Alle anzeigen</button></div><div class="grid g2">${state.alarms.filter(a=>a.status!=='resolved').slice(0,4).map(cardAlarm).join('')||'<div class="card empty">Keine offenen Alarme.</div>'}<div class="card pad"><div class="eyebrow">Letzte Ereignisse</div><div class="list" style="margin-top:12px">${state.events.slice(0,6).map(e=>`<div class="row"><div class="rowMain"><strong>${esc(e.text)}</strong><small>${fmt(e.ts)}</small></div><span class="pill">${esc(e.type)}</span></div>`).join('')}</div></div></div></section>`}
function alarms(){return `<section class="section"><div class="sectionHead"><div><div class="eyebrow">Alarmmanagement</div><h2>Alarme</h2></div><button class="btn primary" onclick="openModal('alarm')">＋ Neuer Alarm</button></div><div class="list">${state.alarms.map(cardAlarm).join('')}</div></section>`}
function contacts(){return `<section class="section"><div class="sectionHead"><div><div class="eyebrow">Erreichbarkeit</div><h2>Kontakte</h2></div><button class="btn primary" onclick="openModal('contact')">＋ Kontakt</button></div><div class="grid g2"><div class="card pad"><div class="list">${state.contacts.map((c,i)=>`<div class="row"><div class="rowMain"><strong>${esc(c.name)}</strong><small>${esc(c.role)} · ${esc(c.phone)}</small></div><button class="btn ghost" onclick="location.href='tel:${esc(c.phone)}'">Anrufen</button><button class="btn secondary" onclick="openModal('contact',${JSON.stringify(c).replace(/</g,'\\u003c')})">Bearbeiten</button><button class="btn danger" onclick="removeContact(${i})">Löschen</button></div>`).join('')||'<div class="empty">Noch keine Kontakte angelegt.</div>'}</div></div><div class="card pad"><div class="eyebrow">Kontaktprinzip</div><h3 style="margin:8px 0">Direkter Zugriff</h3><p class="muted">Kontakte werden lokal gespeichert. Ein Anruf startet erst nach deiner ausdrücklichen Geräteaktion.</p></div></div></section>`}
function devices(){const online=state.devices.filter(d=>d.state==='online').length;return `<section class="section"><div class="sectionHead"><div><div class="eyebrow">Infrastruktur</div><h2>Geräte & Gateways</h2></div><button class="btn primary" onclick="openModal('device')">＋ Gerät</button></div><div class="grid g3">${state.devices.map((d,i)=>`<article class="card pad"><div class="statTop"><span class="pill">${esc(d.type)}</span><span class="status ${d.state==='online'?'ok':d.state==='maintenance'?'warn':'active'}">${d.state==='online'?'ONLINE':d.state==='maintenance'?'WARTUNG':'OFFLINE'}</span></div><h3 style="margin:12px 0 5px">${esc(d.name)}</h3><p class="small muted">Letztes Signal: ${fmt(d.lastSeen)}</p><div class="actions"><button class="btn secondary" onclick="openModal('device',${JSON.stringify(d).replace(/</g,'\\u003c')})">Bearbeiten</button><button class="btn danger" onclick="removeDevice(${i})">Löschen</button></div></article>`).join('')||'<div class="card empty">Keine Geräte erfasst.</div>'}</div><div class="card pad" style="margin-top:14px"><div class="statTop"><div><div class="eyebrow">Verfügbarkeit</div><h3 style="margin:7px 0">${state.devices.length?Math.round(online/state.devices.length*100):100}% online</h3></div><span class="pill">Lokaler Status</span></div><div class="meter"><i style="width:${state.devices.length?Math.round(online/state.devices.length*100):100}%"></i></div></div></section>`}
function events(){return `<section class="section"><div class="sectionHead"><div><div class="eyebrow">Nachvollziehbarkeit</div><h2>Ereignisprotokoll</h2></div><button class="btn secondary" onclick="exportData()">Exportieren</button></div><div class="card pad"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:11px 10px;border-bottom:1px solid #232c37">Zeit</th><th style="text-align:left;padding:11px 10px;border-bottom:1px solid #232c37">Typ</th><th style="text-align:left;padding:11px 10px;border-bottom:1px solid #232c37">Ereignis</th></tr></thead><tbody>${state.events.map(e=>`<tr><td style="padding:11px 10px;border-bottom:1px solid #232c37;font-size:12px">${fmt(e.ts)}</td><td style="padding:11px 10px;border-bottom:1px solid #232c37"><span class="pill">${esc(e.type)}</span></td><td style="padding:11px 10px;border-bottom:1px solid #232c37;font-size:12px">${esc(e.text)}</td></tr>`).join('')}</tbody></table></div></section>`}
function settings(){return `<section class="section"><div class="sectionHead"><div><div class="eyebrow">System</div><h2>Daten & Konfiguration</h2></div><button class="btn primary" onclick="openModal('settings')">Einstellungen öffnen</button></div><div class="grid g2"><div class="card pad"><h3>Lokale Daten</h3><p class="muted">Alarm-, Kontakt-, Geräte- und Ereignisdaten werden in diesem Browserprofil gespeichert.</p><div class="actions"><button class="btn secondary" onclick="exportData()">Backup exportieren</button><button class="btn secondary" onclick="importData()">Backup importieren</button><button class="btn danger" onclick="resetData()">Lokale Daten löschen</button></div></div><div class="card pad"><h3>Build</h3><p class="muted">TGM ALARM CENTER · Version ${VERSION}</p><span class="pill">Installierbare PWA</span></div></div></section>`}
function render(){const content=view==='overview'?overview():view==='alarms'?alarms():view==='contacts'?contacts():view==='devices'?devices():view==='events'?events():settings();document.getElementById('app').innerHTML=`<div class="app"><header class="topbar"><div class="toprow"><div class="brand"><div class="mark">!</div><div><b>TGM ALARM CENTER</b><span>${esc(state.profile.name)} · Leitstellenansicht</span></div></div><div class="connection"><span class="dot"></span>System lokal bereit</div></div><nav class="nav">${[['overview','Übersicht'],['alarms','Alarme'],['contacts','Kontakte'],['devices','Geräte'],['events','Ereignisse'],['settings','System']].map(([v,t])=>`<button class="${view===v?'active':''}" onclick="nav('${v}')">${t}</button>`).join('')}</nav></header>${content}<footer class="footer"><span>TGM ALARM CENTER · ${VERSION}</span><span>Lokale Datenhaltung · keine externe Alarmweiterleitung ohne konfigurierten Dienst</span></footer></div>`}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();setInterval(()=>{if(state.settings.autoRefresh){state.devices.forEach(d=>{if(d.state==='online')d.lastSeen=iso()});save();render()}},15000);
</script>
</body>
</html>
