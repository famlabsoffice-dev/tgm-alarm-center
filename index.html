  <link rel="stylesheet" href="styles.css?v=10">

  <div id="modalRoot" aria-live="polite"></div>
  <div id="alarmOverlay" class="alarm-overlay" aria-live="assertive"></div>

  <script src="ui-cleanup.js?v=3" defer></script>
  <script src="tgm-intelligence.js?v=1" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw-v30.js').then((registration) => registration.update()).catch(() => undefined);
      });
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (sessionStorage.getItem('tgm-sw-v30-reloaded') === '1') return;
        sessionStorage.setItem('tgm-sw-v30-reloaded', '1');
        window.location.reload();
      });
    }
  </script>
