<style>
:root{--bg:#090C12;--panel:#171B21;--card:#1E242B;--card2:#252C34;--text:#EAE6D8;--muted:#9BA0A5;--mint:#79C95B;--gold:#F0C76A;--amber:#D6A84F;--border:#38414A;--blue:#58B7E8;--danger:#D65A50;--red:#B94A43;--shadow:0 18px 55px rgba(0,0,0,.28);--radius:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 10% -10%,rgba(240,199,106,.10),transparent 30%),radial-gradient(circle at 100% 0,rgba(88,183,232,.07),transparent 25%),var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{width:min(1380px,100%);margin:auto;padding:14px 16px 50px}.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 76%,transparent);backdrop-filter:blur(12px);padding-bottom:12px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px}.mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#F0C76A,#B78327);color:#17130a;display:grid;place-items:center;font-weight:1000;box-shadow:0 10px 28px rgba(240,199,106,.18)}.brand b{display:block;letter-spacing:.04em}.brand span{display:block;color:var(--muted);font-size:11px}.accountPill{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:rgba(23,27,33,.82);padding:8px 12px;border-radius:999px;color:#d9dde1;font-size:12px}.accountDot{width:9px;height:9px;border-radius:50%;background:var(--gold)}.nav{display:flex;gap:7px;overflow:auto;padding-top:10px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 13px;border-radius:11px;font-weight:850;white-space:nowrap}.nav button.active{background:#20252C;border-color:var(--border);color:#fff}.nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(88,183,232,.45);outline-offset:2px}.grid{display:grid;gap:14px}.g2{grid-template-columns:1.45fr .8fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.card{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.008)),var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.pad{padding:20px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:#8b949c;font-size:10px;font-weight:900}.muted{color:var(--muted)}.small{font-size:12px}.h1{font-size:34px;line-height:1.08;margin:7px 0 10px}.h2{font-size:21px;margin:0}.hero{padding:23px}.heroRow{display:flex;align-items:stretch;gap:18px}.heroMain{flex:1}.heroSide{width:305px;display:grid;gap:11px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.btn{border:1px solid transparent;border-radius:12px;padding:11px 14px;font-weight:900}.primary{background:var(--gold);color:#1b160d}.primary:hover{filter:brightness(1.06)}.secondary{background:var(--card2);border-color:#444c55;color:#f0f1ed}.ghost{background:transparent;color:#d8dde3;border-color:#444c55}.danger{background:#3b1d20;color:#ffb5ab;border-color:#66312e}.goldText{color:var(--gold)}.mintText{color:var(--mint)}.redText{color:#ffaaa0}.stat{padding:17px}.statTop{display:flex;justify-content:space-between;align-items:center}.statValue{font-size:28px;font-weight:950;margin-top:9px}.statLabel{color:var(--muted);font-size:12px}.icon{width:39px;height:39px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:18px}.nextBox{padding:16px;background:linear-gradient(145deg,rgba(240,199,106,.10),rgba(240,199,106,.02));border:1px solid #5a4a2c;border-radius:14px}.nextTime{font-size:31px;font-weight:950;margin:6px 0}.countdown{font-variant-numeric:tabular-nums;letter-spacing:.02em}.list{display:grid;gap:9px}.row{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--border);background:#12171d;border-radius:14px}.rowMain{flex:1;min-width:0}.rowMain strong{display:block}.rowMain small{display:block;color:#89929b;margin-top:3px}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:#141a20;color:#cad1d7;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}.badge.gold{color:#f8d889;border-color:#67532d;background:#231e13}.badge.mint{color:#a7ec90;border-color:#2c5f2e;background:#132015}.badge.blue{color:#abe0fb;border-color:#2a5470;background:#131f29}.badge.red{color:#ffb2aa;border-color:#63302c;background:#231514}.alarmCard{padding:17px}.alarmHead{display:flex;gap:12px;justify-content:space-between}.alarmTitle{font-size:17px;font-weight:900}.alarmMeta{color:var(--muted);font-size:12px;margin-top:4px}.divider{height:1px;background:var(--border);margin:14px 0}.field{display:grid;gap:6px;margin-top:12px}.field label{font-size:11px;font-weight:900;color:#cdd3d8}.field input,.field select{width:100%;background:#0f1419;color:#fff;border:1px solid #3c4650;border-radius:11px;padding:11px 12px}.field input::placeholder{color:#69737c}.checkRow{display:flex;align-items:center;gap:9px;margin-top:12px;color:#d8dde2}.checkRow input{width:18px;height:18px}.templateGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.template{padding:15px;border:1px solid var(--border);border-radius:14px;background:#12171d;text-align:left}.template strong{display:block}.template span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.template:hover{border-color:#665730}.template.active{border-color:var(--gold);box-shadow:0 0 0 1px rgba(240,199,106,.18) inset}.modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(7px);z-index:100;display:grid;place-items:center;padding:15px}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:#181d24;border:1px solid #414b55;border-radius:20px;padding:22px;box-shadow:0 30px 100px rgba(0,0,0,.6)}.modalHead{display:flex;justify-content:space-between;gap:12px;align-items:center}.modalHead h3{margin:0;font-size:22px}.close{background:transparent;border:0;color:#aab2ba;font-size:24px;width:40px;height:40px;border-radius:10px}.close:hover{background:#252c34;color:#fff}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140px);opacity:0;transition:.22s;z-index:150;background:#171d23;border:1px solid #46515c;color:#fff;padding:12px 15px;border-radius:13px;max-width:90vw;text-align:center;box-shadow:0 18px 55px rgba(0,0,0,.45)}.toast.show{transform:translate(-50%,0);opacity:1}.empty{padding:35px;text-align:center}.empty h3{margin:0 0 7px}.empty p{margin:0;color:var(--muted)}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.sectionTitle h2{margin:0;font-size:20px}.priceGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.priceCard{padding:18px}.price{font-size:30px;font-weight:950}.per{font-size:11px;color:var(--muted)}.featureList{display:grid;gap:7px;margin:14px 0}.feature{display:flex;gap:7px;color:#d7dce1;font-size:12px}.healthGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.healthItem{padding:15px;border:1px solid var(--border);background:#12171d;border-radius:14px;display:flex;align-items:center;gap:10px}.healthDot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}.ok{background:var(--mint)}.warn{background:var(--amber)}.off{background:#727a82}.bad{background:var(--danger)}.footer{margin-top:30px;color:#6f7880;font-size:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.dangerText{color:var(--danger)}
@media(max-width:1000px){.g4,.g3,.priceGrid{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}.heroSide{width:auto}.heroRow{flex-direction:column}}
@media(orientation:portrait) and (max-width:900px){body:before{content:"TGM ALARM CENTER benötigt das Querformat.";position:fixed;inset:0;z-index:500;background:#090C12;color:#fff;display:grid;place-items:center;text-align:center;padding:30px;font-weight:950;font-size:20px}.app{display:none}}
@media(max-width:620px){.g4,.g3,.priceGrid,.healthGrid{grid-template-columns:1fr}.templateGrid{grid-template-columns:1fr}.app{padding:10px}.h1{font-size:27px}.hero{padding:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<body>
<div id="app"></div><div id="modalRoot"></div><div id="toast" class="toast"></div>
<script>
'use strict';
const STORE='tgm-alarm-center-v1';
const SCHEMA_VERSION=1;
const BACKUP_FORMAT='tgm-alarm-center-backup';
const BACKUP_VERSION=1;
const SCHEDULE_HORIZON_DAYS=30;
const MAX_WEB_SCHEDULED=64;
const TIERS={
 free:{id:'free',label:'Free',accounts:1,alarms:1,events:1,month:0,year:0,lifetime:0,saving:0},
 street:{id:'street',label:'Street Boss',accounts:2,alarms:2,events:2,month:4.99,year:39.99,lifetime:79.99,saving:33},
 caporegime:{id:'caporegime',label:'Caporegime',accounts:3,alarms:3,events:3,month:7.99,year:69.99,lifetime:129.99,saving:27},
 godfather:{id:'godfather',label:'Godfather',accounts:null,alarms:null,events:null,month:12.99,year:99.99,lifetime:199.99,saving:36}
};
const SOUNDS={pulse:{label:'Pulse',file:'alarm-pulse.wav'},siren:{label:'Siren',file:'alarm-siren.wav'},chime:{label:'Chime',file:'alarm-chime.wav'}};
const DEFAULT_PREFS={sound:'pulse',warningSound:true,alarmSound:true,vibration:true,criticalAlertsEnabled:true,preview:true};
const TYPE_LABEL={bubble:'Bubble',gw:'GW Bubble',custom:'Eigenes Event'};
const uid=()=>crypto.randomUUID?crypto.randomUUID():`id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
const now=()=>Date.now();
const iso=ms=>new Date(ms).toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const localFormat=ms=>new Intl.DateTimeFormat('de-DE',{dateStyle:'short',timeStyle:'short'}).format(new Date(ms));
const localTime=ms=>new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit'}).format(new Date(ms));
const localDate=ms=>{const d=new Date(ms);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const money=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n);
function emptyState(){return{schemaVersion:SCHEMA_VERSION,activeAccountId:null,tierId:'free',accounts:[],alarms:[],preferences:{...DEFAULT_PREFS},testConfirmedAt:null,updatedAt:iso(now())}}
function normalize(s){const b=emptyState();const out={...b,...s,schemaVersion:SCHEMA_VERSION,accounts:Array.isArray(s?.accounts)?s.accounts:[],alarms:Array.isArray(s?.alarms)?s.alarms:[],preferences:{...DEFAULT_PREFS,...(s?.preferences||{})}};if(!TIERS[out.tierId])out.tierId='free';if(out.activeAccountId&&!out.accounts.some(a=>a.id===out.activeAccountId))out.activeAccountId=out.accounts[0]?.id||null;out.accounts=out.accounts.filter(a=>a&&typeof a.id==='string'&&typeof a.name==='string');out.alarms=out.alarms.filter(a=>a&&typeof a.id==='string'&&typeof a.title==='string'&&a.accountId&&out.accounts.some(ac=>ac.id===a.accountId));return out}
function load(){try{const raw=localStorage.getItem(STORE);return raw?normalize(JSON.parse(raw)):emptyState()}catch{return emptyState()}}
let state=load(),view='today',editingId=null,selectedTemplate='bubble',saveBusy=false,scheduledTimers=new Map();
function persist(){state.updatedAt=iso(now());localStorage.setItem(STORE,JSON.stringify(state))}
function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
function tier(){return TIERS[state.tierId]||TIERS.free}
function activeAccount(){return state.accounts.find(a=>a.id===state.activeAccountId)||null}
function accountAlarmCount(accountId){return state.alarms.filter(a=>a.accountId===accountId).length}
function limitReached(resource,accountId){const lim=tier()[resource];if(lim===null)return false;return accountId?accountAlarmCount(accountId)>=lim:false}
function templateData(t){
 if(t==='bubble')return{type:'bubble',title:'Bubble-Zeitfenster',warnings:[60,15],repeat:'once',sound:'pulse',gwCycle:false};
 if(t==='gw')return{type:'gw',title:'GW-Zeitfenster',warnings:[60,30,15],repeat:'once',sound:'siren',gwCycle:false};
 return{type:'custom',title:'Mein TGM-Event',warnings:[15],repeat:'once',sound:'chime',gwCycle:false};
}
function isValidDateTime(date,time){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(time))return false;
 const [y,m,d]=date.split('-').map(Number),[hh,mm]=time.split(':').map(Number);const x=new Date(y,m-1,d,hh,mm,0,0);
 return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d&&x.getHours()===hh&&x.getMinutes()===mm?x.getTime():false;
}
function nextDaily(baseMs){const base=new Date(baseMs),n=new Date();let c=new Date(n.getFullYear(),n.getMonth(),n.getDate(),base.getHours(),base.getMinutes(),0,0);if(c.getTime()<=n.getTime())c.setDate(c.getDate()+1);return c.getTime()}
function occurrenceFor(alarm,ref=now()){if(!alarm.active)return null;if(alarm.repeat==='once')return alarm.eventAt>ref?alarm.eventAt:null;if(alarm.repeat==='daily'){const base=alarm.eventAt;if(base>ref)return base;return nextDaily(base)}if(alarm.repeat==='gw5d'){const delta=Math.max(0,ref-alarm.eventAt);const n=Math.floor(delta/(5*86400000))+1;return alarm.eventAt+n*5*86400000}return null}
function completionKey(alarmId,eventAt){return `${alarmId}|${eventAt}`}
function isCompleted(alarm,eventAt){return Array.isArray(alarm.completedOccurrences)&&alarm.completedOccurrences.includes(completionKey(alarm.id,eventAt))}
function upcomingMoments(alarm,ref=now()){
 const out=[], main=occurrenceFor(alarm,ref);if(!main)return out;if(!isCompleted(alarm,main)){
   for(const m of (alarm.warnings||[]).slice().sort((a,b)=>b-a)){const t=main-m*60000;if(t>ref)out.push({alarmId:alarm.id,eventAt:main,at:t,kind:'warning',warningMinutes:m});}
   out.push({alarmId:alarm.id,eventAt:main,at:main,kind:'main'});
   if(alarm.repeat==='gw5d'){const end=main+86400000;const endWarn=end-60*60000;if(endWarn>ref)out.push({alarmId:alarm.id,eventAt:main,at:endWarn,kind:'end-warning',endAt:end});if(end>ref)out.push({alarmId:alarm.id,eventAt:main,at:end,kind:'end',endAt:end});}
 }
 return out;
}
function allMoments(ref=now()){return state.alarms.filter(a=>a.active).flatMap(a=>upcomingMoments(a,ref)).sort((a,b)=>a.at-b.at)}
function nextRelevant(){return allMoments()[0]||null}
function countdownText(ms){const d=Math.max(0,ms-now());if(d<=1000)return'jetzt';const days=Math.floor(d/86400000),h=Math.floor(d%86400000/3600000),m=Math.floor(d%3600000/60000),s=Math.floor(d%60000/1000);if(days>0)return`${days} T · ${String(h).padStart(2,'0')} Std.`;if(h>0)return`${h} Std. · ${String(m).padStart(2,'0')} Min.`;if(m>0)return`${m} Min. · ${String(s).padStart(2,'0')} Sek.`;return`${s} Sek.`}
function eventLabel(m){if(m.kind==='warning')return`${m.warningMinutes} Min. Vorwarnung`;if(m.kind==='main')return'Hauptereignis';if(m.kind==='end-warning')return'Bubble-Ende-Warnung';return'Bubble-Ende'}
function eventBody(alarm,m){const t=localFormat(m.eventAt);if(m.kind==='end-warning')return`${alarm.title}: Der Schutz endet um ${localTime(m.endAt)}. Eine neue Bubble kann erforderlich werden.`;if(m.kind==='end')return`${alarm.title}: Der Schutz endet jetzt. Eine neue Bubble kann erforderlich werden.`;return`${alarm.title} · ${TYPE_LABEL[alarm.type]} · ${t}${m.kind==='warning'?` · Vorwarnung ${m.warningMinutes} Min.`:''}`}
function render(){document.getElementById('app').innerHTML=`<main class="app"><header class="topbar"><div class="toprow"><div class="brand"><div class="mark">T</div><div><b>TGM ALARM CENTER</b><span>Persönliche Alarmzentrale</span></div></div><div class="accountPill"><span class="accountDot"></span>${esc(activeAccount()?.name||'Kein Account')}</div></div><nav class="nav" aria-label="Hauptnavigation">${[['today','Heute'],['alarms','Alarme'],['profile','Profil']].map(([k,l])=>`<button class="${view===k?'active':''}" onclick="setView('${k}')">${l}</button>`).join('')}</nav></header>${view==='today'?renderToday():view==='alarms'?renderAlarms():renderProfile()}<footer class="footer"><span>Schema ${SCHEMA_VERSION} · Backup ${BACKUP_VERSION}</span><span>TGM ALARM CENTER</span></footer></main>`}
function renderToday(){const next=nextRelevant(),a=next?state.alarms.find(x=>x.id===next.alarmId):null;const active=state.alarms.filter(x=>x.active).length;const planned=allMoments().filter(x=>x.at<=now()+SCHEDULE_HORIZON_DAYS*86400000).length;return `<section class="hero card"><div class="heroRow"><div class="heroMain"><div class="eyebrow">Heute</div><h1 class="h1">${next&&a?esc(a.title):'Bereit für den nächsten Alarm'}</h1><p class="muted">${next&&a?`${esc(eventLabel(next))} · ${esc(TYPE_LABEL[a.type])} · ${localFormat(next.at)}`:'Lege deinen ersten TGM-Alarm an und verpasse kein Zeitfenster mehr.'}</p><div class="actions"><button class="btn primary" onclick="openEditor()">Alarm erstellen</button>${!state.activeAccountId?'<button class="btn secondary" onclick="openAccount()">Account anlegen</button>':''}<button class="btn ghost" onclick="setView('profile')">Health</button></div></div><div class="heroSide">${next&&a?`<div class="nextBox"><div class="eyebrow">Als Nächstes</div><div class="nextTime countdown" id="countdown">${countdownText(next.at-now()+now())}</div><div class="muted small">${localFormat(next.at)} · ${esc(eventLabel(next))}</div></div>`:'<div class="nextBox"><div class="eyebrow">Noch keine Planung</div><div class="nextTime">—</div><div class="muted small">Keine aktiven Termine</div></div>'}<div class="card pad"><div class="small muted">Lokale Zeit</div><div style="font-size:22px;font-weight:900" id="clock">${localFormat(now())}</div>${next&&a?`<div class="small muted" style="margin-top:5px">UTC ${iso(next.at)}</div>`:''}</div></div></div></section><section class="grid g4" style="margin-top:14px"><div class="stat card"><div class="statTop"><div class="icon">⏱</div><span class="badge gold">LIVE</span></div><div class="statValue">${active}</div><div class="statLabel">Aktive Alarme</div></div><div class="stat card"><div class="statTop"><div class="icon">◷</div><span class="badge blue">HORIZONT</span></div><div class="statValue">${planned}</div><div class="statLabel">Kommende Planungen</div></div><div class="stat card"><div class="statTop"><div class="icon">◆</div><span class="badge mint">${esc(tier().label)}</span></div><div class="statValue">${state.accounts.length}</div><div class="statLabel">Accounts</div></div><div class="stat card"><div class="statTop"><div class="icon">✓</div><span class="badge ${healthOverall().class}">${healthOverall().label}</span></div><div class="statValue">${state.testConfirmedAt?'OK':'—'}</div><div class="statLabel">Lokaler Test</div></div></section><section class="grid g2" style="margin-top:14px"><div class="card pad"><div class="sectionTitle"><h2>Kommende Ereignisse</h2><button class="btn ghost" onclick="setView('alarms')">Alle Alarme</button></div>${renderUpcomingList()}</div><div class="card pad"><div class="sectionTitle"><h2>Alarmklassen</h2></div><div class="list"><div class="row"><div class="icon">B</div><div class="rowMain"><strong>Bubble</strong><small>60 / 15 Minuten · Pulse</small></div></div><div class="row"><div class="icon">G</div><div class="rowMain"><strong>GW Bubble</strong><small>60 / 30 / 15 Minuten · Siren</small></div></div><div class="row"><div class="icon">E</div><div class="rowMain"><strong>Eigenes Event</strong><small>15 Minuten · Chime</small></div></div></div></div></section>`}
function renderUpcomingList(){const moments=allMoments().slice(0,8);if(!moments.length)return`<div class="empty"><h3>Keine anstehenden Ereignisse</h3><p>Erstelle einen Alarm über die Schaltfläche oben.</p></div>`;return`<div class="list">${moments.map(m=>{const a=state.alarms.find(x=>x.id===m.alarmId);return`<div class="row"><div class="icon">${m.kind==='end'||m.kind==='end-warning'?'!':'•'}</div><div class="rowMain"><strong>${esc(a.title)}</strong><small>${esc(eventLabel(m))} · ${localFormat(m.at)}</small></div><span class="badge ${m.kind==='main'||m.kind==='end'?'gold':'blue'}">${TYPE_LABEL[a.type]}</span></div>`}).join('')}</div>`}
function renderAlarms(){return`<section class="card pad"><div class="sectionTitle"><div><div class="eyebrow">Alarmverwaltung</div><h2 class="h2" style="margin-top:4px">Alarme</h2></div><button class="btn primary" onclick="openEditor()">+ Alarm</button></div>${state.accounts.length?`<div class="list">${state.alarms.map(renderAlarmCard).join('')||'<div class="empty"><h3>Noch keine Alarme</h3><p>Erstelle den ersten Alarm für deinen aktiven Account.</p></div>'}</div>`:'<div class="empty"><h3>Account erforderlich</h3><p>Lege zuerst einen Account an.</p><div class="actions" style="justify-content:center"><button class="btn primary" onclick="openAccount()">Account anlegen</button></div></div>'}</section>`}
function renderAlarmCard(a){const next=occurrenceFor(a);const acc=state.accounts.find(x=>x.id===a.accountId);return`<article class="alarmCard card"><div class="alarmHead"><div><div class="badges"><span class="badge gold">${TYPE_LABEL[a.type]}</span><span class="badge ${a.active?'mint':'red'}">${a.active?'AKTIV':'PAUSIERT'}</span>${a.protected?'<span class="badge blue">GESCHÜTZT</span>':''}<span class="badge">${a.repeat==='daily'?'TÄGLICH':a.repeat==='gw5d'?'ALLE 5 TAGE':'EINMALIG'}</span></div><div class="alarmTitle" style="margin-top:8px">${esc(a.title)}</div><div class="alarmMeta">${acc?esc(acc.name):'—'} · Ton ${esc(SOUNDS[a.sound]?.label||'Pulse')}</div></div><div style="text-align:right"><div class="small muted">Nächster Termin</div><strong>${next?localFormat(next):'kein weiterer Termin'}</strong></div></div><div class="divider"></div><div class="badges"><span class="badge">Warnungen ${(a.warnings||[]).join(' / ')} Min.</span>${a.repeat==='gw5d'?'<span class="badge gold">24h Schutzfenster</span>':''}<span class="badge">UTC ${next?iso(next):'—'}</span></div><div class="actions"><button class="btn secondary" onclick="openEditor('${a.id}')">Bearbeiten</button><button class="btn ghost" onclick="toggleAlarm('${a.id}')">${a.active?'Pausieren':'Aktivieren'}</button><button class="btn ghost" onclick="duplicateAlarm('${a.id}')">Duplizieren</button><button class="btn danger" onclick="deleteAlarm('${a.id}')">Löschen</button></div></article>`}
function renderProfile(){const h=healthDetails();return`<section class="grid g2"><div class="card pad"><div class="sectionTitle"><div><div class="eyebrow">Profil & Account</div><h2 class="h2" style="margin-top:4px">${esc(activeAccount()?.name||'Kein Account')}</h2></div><span class="badge gold">${esc(tier().label)}</span></div><div class="list">${state.accounts.map(a=>`<div class="row"><span class="accountDot" style="background:${esc(a.color)}"></span><div class="rowMain"><strong>${esc(a.name)}</strong><small>${accountAlarmCount(a.id)} / ${tier().alarms===null?'∞':tier().alarms} Alarme</small></div>${state.activeAccountId===a.id?'<span class="badge mint">AKTIV</span>':'<button class="btn ghost" onclick="selectAccount(\''+a.id+'\')">Aktivieren</button>'}</div>`).join('')||'<div class="empty"><h3>Kein Account</h3><p>Ein Account gehört zu jeder Alarmplanung.</p></div>'}</div><div class="actions"><button class="btn primary" onclick="openAccount()">Account hinzufügen</button><button class="btn secondary" onclick="openPlans()">Pläne</button><button class="btn ghost" onclick="openNotifications()">Benachrichtigungen</button></div></div><div class="card pad"><div class="sectionTitle"><h2 class="h2">Health</h2></div><div class="healthGrid">${h.map(x=>`<div class="healthItem"><span class="healthDot ${x.class}"></span><div><strong>${esc(x.title)}</strong><div class="small muted">${esc(x.text)}</div></div></div>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="runLocalTest()">Lokalen Test starten</button><button class="btn ghost" onclick="openBackup()">Backup & Wiederherstellung</button></div></div></section><section class="card pad" style="margin-top:14px"><div class="sectionTitle"><h2 class="h2">Benachrichtigungen</h2><button class="btn ghost" onclick="openNotifications()">Einstellungen</button></div><div class="badges"><span class="badge">Ton ${esc(SOUNDS[state.preferences.sound].label)}</span><span class="badge">Vorwarnung ${state.preferences.warningSound?'an':'aus'}</span><span class="badge">Hauptereignis ${state.preferences.alarmSound?'an':'aus'}</span><span class="badge">Vibration ${state.preferences.vibration?'an':'aus'}</span><span class="badge">Vorschau ${state.preferences.preview?'an':'aus'}</span></div></section>`}
function healthDetails(){const webNotifications='Notification' in window;return[
 {title:'Plattform',text:'Web-PWA',class:'warn'},
 {title:'Native Zustellung',text:'Android/iOS separat erforderlich',class:'off'},
 {title:'Browser-Berechtigung',text:webNotifications?(Notification.permission==='granted'?'gewährt':Notification.permission==='denied'?'verweigert':'nicht gefragt'):'nicht verfügbar',class:!webNotifications?'off':Notification.permission==='granted'?'ok':Notification.permission==='denied'?'bad':'warn'},
 {title:'Scheduler',text:`In-App-Planung · ${allMoments().length} Ereignisse`,class:'ok'},

function healthOverall(){const h=healthDetails();const bad=h.some(x=>x.class==='bad');if(bad)return{label:'FEHLER',class:'red'};if(h.some(x=>x.class==='warn'))return{label:'WARNUNG',class:'gold'};return{label:'OK',class:'mint'}}
function setView(v){view=v;closeModal();render();startTicker()}
function openAccount(editId=''){const a=state.accounts.find(x=>x.id===editId);document.getElementById('modalRoot').innerHTML=`<div class="modalWrap"><div class="modal" role="dialog" aria-modal="true"><div class="modalHead"><h3>${a?'Account bearbeiten':'Account anlegen'}</h3><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>NAME</label><input id="accName" maxlength="50" value="${esc(a?.name||'')}" placeholder="z. B. Command Alpha"></div><div class="field"><label>FARBE</label><input id="accColor" type="color" value="${esc(a?.color||'#F0C76A')}" aria-label="Accountfarbe"></div><div class="actions"><button class="btn primary" onclick="saveAccount('${editId}')">Speichern</button><button class="btn secondary" onclick="closeModal()">Abbrechen</button></div></div></div>`;document.getElementById('accName').focus()}
function saveAccount(id=''){const name=document.getElementById('accName').value.trim();const color=document.getElementById('accColor').value;if(!name)return toast('Bitte einen Accountnamen eingeben.');if(!id&&tier().accounts!==null&&state.accounts.length>=tier().accounts)return openPlans('account');if(id){const a=state.accounts.find(x=>x.id===id);if(a){a.name=name;a.color=color}}else{const a={id:uid(),name,color,createdAt:iso(now())};state.accounts.push(a);if(!state.activeAccountId)state.activeAccountId=a.id}persist();closeModal();render();toast('Account gespeichert.')}
function selectAccount(id){if(!state.accounts.some(a=>a.id===id))return;state.activeAccountId=id;persist();render();toast('Aktiver Account geändert.')}
function openEditor(id=''){editingId=id;const a=state.alarms.find(x=>x.id===id),t=a||templateData(selectedTemplate);selectedTemplate=a?a.type:selectedTemplate;const d=a?new Date(a.eventAt):new Date(Date.now()+3600000);const date=a?localDate(a.eventAt):localDate(d.getTime()),time=a?localTime(a.eventAt):localTime(d.getTime());document.getElementById('modalRoot').innerHTML=`<div class="modalWrap"><div class="modal" role="dialog" aria-modal="true"><div class="modalHead"><h3>${a?'Alarm bearbeiten':'Alarm erstellen'}</h3><button class="close" onclick="closeModal()">×</button></div>${!a?`<div class="eyebrow" style="margin-top:15px">Schnellstart</div><div class="templateGrid">${['bubble','gw','custom'].map(k=>{const x=templateData(k);return`<button class="template ${selectedTemplate===k?'active':''}" onclick="selectTemplate('${k}')"><strong>${TYPE_LABEL[k]}</strong><span>${x.warnings.join(' / ')} Min. · ${SOunds(x.sound)}</span></button>`}).join('')}</div>`:''}<div class="field"><label>TYP</label><select id="eType" onchange="syncTemplateFields()"><option value="bubble" ${t.type==='bubble'?'selected':''}>Bubble</option><option value="gw" ${t.type==='gw'?'selected':''}>GW Bubble</option><option value="custom" ${t.type==='custom'?'selected':''}>Eigenes Event</option></select></div><div class="field"><label>BEZEICHNUNG</label><input id="eTitle" maxlength="80" value="${esc(t.title||'')}"></div><div class="grid g2"><div class="field"><label>DATUM</label><input id="eDate" type="date" value="${date}"></div><div class="field"><label>UHRZEIT</label><input id="eTime" type="time" value="${time}"></div></div><div class="grid g2"><div class="field"><label>WIEDERHOLUNG</label><select id="eRepeat"><option value="once" ${t.repeat==='once'?'selected':''}>einmalig</option><option value="daily" ${t.repeat==='daily'?'selected':''}>täglich</option>${t.type==='gw'?`<option value="gw5d" ${t.repeat==='gw5d'?'selected':''}>alle 5 Tage · 24h Schutzfenster</option>`:''}</select></div><div class="field"><label>TON</label><select id="eSound"><option value="pulse" ${(t.sound||'pulse')==='pulse'?'selected':''}>Pulse</option><option value="siren" ${(t.sound||'pulse')==='siren'?'selected':''}>Siren</option><option value="chime" ${(t.sound||'pulse')==='chime'?'selected':''}>Chime</option></select></div></div><div class="field"><label>VORWARNUNGEN</label><div class="badges" id="warnChecks">${[15,30,60].map(m=>`<label class="badge"><input type="checkbox" value="${m}" ${Array.isArray(t.warnings)&&t.warnings.includes(m)?'checked':''}> ${m} Min.</label>`).join('')}</div></div><label class="checkRow"><input id="eProtected" type="checkbox" ${t.protected?'checked':''}> Geschütztes Ereignis</label><label class="checkRow"><input id="eActive" type="checkbox" ${a?(a.active!==false):true}> Aktiv</label><div class="actions"><button class="btn primary" onclick="saveAlarm()">Speichern</button>${a?`<button class="btn danger" onclick="deleteAlarm('${a.id}')">Löschen</button>`:''}<button class="btn secondary" onclick="closeModal()">Abbrechen</button></div></div></div>`;document.getElementById('eTitle').focus()}
function SOunds(sound){return SOUNDS[sound].label}
function selectTemplate(k){selectedTemplate=k;openEditor()}
function syncTemplateFields(){const type=document.getElementById('eType').value;if(type==='gw'&&!['gw5d','once','daily'].includes(document.getElementById('eRepeat').value))document.getElementById('eRepeat').value='once'}
function saveAlarm(){if(saveBusy)return;saveBusy=true;try{if(!state.activeAccountId)return toast('Bitte zuerst einen Account anlegen.');const existing=editingId?state.alarms.find(a=>a.id===editingId):null;if(!existing&&tier().alarms!==null&&accountAlarmCount(state.activeAccountId)>=tier().alarms)return openPlans('alarm');const title=document.getElementById('eTitle').value.trim();const type=document.getElementById('eType').value;const date=document.getElementById('eDate').value;const time=document.getElementById('eTime').value;const eventAt=isValidDateTime(date,time);if(!title)return toast('Bitte eine Bezeichnung eingeben.');if(!eventAt)return toast('Datum oder Uhrzeit ist ungültig.');if(!existing&&eventAt<=now())return toast('Ein neuer einmaliger Alarm muss in der Zukunft liegen.');const repeat=document.getElementById('eRepeat').value;if(repeat==='gw5d'&&type!=='gw')return toast('Der 5-Tage-Zyklus ist nur für GW Bubble verfügbar.');const warnings=[...document.querySelectorAll('#warnChecks input:checked')].map(x=>Number(x.value)).sort((a,b)=>b-a);if(!warnings.length)return toast('Bitte mindestens eine Vorwarnung wählen.');const data=existing||{id:uid(),createdAt:iso(now()),completedOccurrences:[]};Object.assign(data,{accountId:state.activeAccountId,title,type,eventAt,repeat,warnings,sound:document.getElementById('eSound').value,protected:document.getElementById('eProtected').checked,active:document.getElementById('eActive').checked});if(existing){data.completedOccurrences=(existing.completedOccurrences||[]).filter(k=>k.startsWith(`${existing.id}|`))}if(!existing)state.alarms.push(data);persist();rescheduleWeb();closeModal();render();toast(existing?'Alarm gespeichert.':'Alarm erstellt.')}finally{saveBusy=false}}
function toggleAlarm(id){const a=state.alarms.find(x=>x.id===id);if(!a)return;a.active=!a.active;persist();rescheduleWeb();render();toast(a.active?'Alarm aktiviert.':'Alarm pausiert.')}
function duplicateAlarm(id){const src=state.alarms.find(a=>a.id===id);if(!src)return;const accId=src.accountId;if(tier().alarms!==null&&accountAlarmCount(accId)>=tier().alarms)return openPlans('alarm');const copy={...src,id:uid(),title:`${src.title} Kopie`,active:false,createdAt:iso(now()),completedOccurrences:[]};state.alarms.push(copy);persist();render();toast('Alarm dupliziert und pausiert gespeichert.')}
function deleteAlarm(id){const a=state.alarms.find(x=>x.id===id);if(!a)return;const yes=confirm(`„${a.title}“ wirklich löschen?`);if(!yes)return;state.alarms=state.alarms.filter(x=>x.id!==id);persist();rescheduleWeb();closeModal();render();toast('Alarm gelöscht.')}
function markCompleted(alarmId,eventAt){const a=state.alarms.find(x=>x.id===alarmId);if(!a)return;a.completedOccurrences=Array.from(new Set([...(a.completedOccurrences||[]),completionKey(alarmId,eventAt)]));persist();rescheduleWeb();render();toast('Ereignis erledigt.')}
function requestBrowserPermission(){if(!('Notification' in window))return toast('Browser-Benachrichtigungen sind auf diesem Gerät nicht verfügbar.');Notification.requestPermission().then(p=>{render();rescheduleWeb();toast(p==='granted'?'Benachrichtigungen aktiviert.':'Benachrichtigungszugriff nicht erteilt.')})}
function rescheduleWeb(){for(const t of scheduledTimers.values())clearTimeout(t);scheduledTimers.clear();if(!('Notification'in window)||Notification.permission!=='granted')return;const moments=allMoments().filter(m=>m.at>now()&&m.at<=now()+SCHEDULE_HORIZON_DAYS*86400000).slice(0,MAX_WEB_SCHEDULED);for(const m of moments){const a=state.alarms.find(x=>x.id===m.alarmId);if(!a)continue;const key=`${a.id}|${m.at}|${m.kind}`;const delay=Math.max(0,m.at-now());const t=setTimeout(()=>fireWebNotification(a,m),delay);scheduledTimers.set(key,t)}}
function fireWebNotification(a,m){const title=m.kind==='main'?a.title:m.kind==='end'||m.kind==='end-warning'?'TGM Bubble':`${a.title} · Vorwarnung`;const body=eventBody(a,m);if('Notification'in window&&Notification.permission==='granted'){const n=new Notification(title,{body,tag:`tgm-${a.id}-${m.at}-${m.kind}`,renotify:true});n.onclick=()=>{window.focus();editingId=a.id;openEditor(a.id)}};if(m.kind==='main'&&m.repeat==='once'){};rescheduleWeb()}
function openNotifications(){document.getElementById('modalRoot').innerHTML=`<div class="modalWrap"><div class="modal" role="dialog" aria-modal="true"><div class="modalHead"><h3>Benachrichtigungen</h3><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>ALARMTON</label><select id="nSound"><option value="pulse" ${state.preferences.sound==='pulse'?'selected':''}>Pulse</option><option value="siren" ${state.preferences.sound==='siren'?'selected':''}>Siren</option><option value="chime" ${state.preferences.sound==='chime'?'selected':''}>Chime</option></select></div><label class="checkRow"><input id="nWarning" type="checkbox" ${state.preferences.warningSound?'checked':''}> Vorwarnungston aktiv</label><label class="checkRow"><input id="nAlarm" type="checkbox" ${state.preferences.alarmSound?'checked':''}> Hauptereignis-Ton aktiv</label><label class="checkRow"><input id="nVib" type="checkbox" ${state.preferences.vibration?'checked':''}> Vibration aktiv</label><label class="checkRow"><input id="nCritical" type="checkbox" ${state.preferences.criticalAlertsEnabled?'checked':''}> Kritische Alarme aktiviert</label><label class="checkRow"><input id="nPreview" type="checkbox" ${state.preferences.preview?'checked':''}> Vorschau anzeigen</label><div class="actions"><button class="btn secondary" onclick="requestBrowserPermission()">Browser-Berechtigung prüfen</button><button class="btn ghost" onclick="previewSound()">Ton prüfen</button><button class="btn primary" onclick="saveNotifications()">Speichern</button></div></div></div>`}
function saveNotifications(){state.preferences.sound=document.getElementById('nSound').value;state.preferences.warningSound=document.getElementById('nWarning').checked;state.preferences.alarmSound=document.getElementById('nAlarm').checked;state.preferences.vibration=document.getElementById('nVib').checked;state.preferences.criticalAlertsEnabled=document.getElementById('nCritical').checked;state.preferences.preview=document.getElementById('nPreview').checked;persist();rescheduleWeb();closeModal();render();toast('Benachrichtigungseinstellungen gespeichert.')}
function previewSound(){if(!state.preferences.preview)return toast('Tonvorschau ist deaktiviert.');const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return toast('Audio ist auf diesem Gerät nicht verfügbar.');const c=new AudioCtx(),o=c.createOscillator(),g=c.createGain();o.type=state.preferences.sound==='siren'?'sawtooth':state.preferences.sound==='chime'?'sine':'square';o.frequency.value=state.preferences.sound==='siren'?680:state.preferences.sound==='chime'?880:520;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.22);toast(`Tonvorschau: ${SOUNDS[state.preferences.sound].label}`)}
function openPlans(target=''){const current=state.tierId;document.getElementById('modalRoot').innerHTML=`<div class="modalWrap"><div class="modal" role="dialog" aria-modal="true"><div class="modalHead"><h3>Pläne</h3><button class="close" onclick="closeModal()">×</button></div><div class="priceGrid" style="grid-template-columns:repeat(2,1fr);margin-top:14px">${Object.values(TIERS).map(t=>`<article class="priceCard card" style="box-shadow:none"><div class="badges"><span class="badge ${t.id===current?'gold':''}">${esc(t.label)}</span></div><div class="price" style="margin-top:9px">${money(t.month)} <span class="per">/ Monat</span></div><div class="small muted">Jahr ${money(t.year)} · Lifetime ${money(t.lifetime)}</div>${t.year?`<div class="badge mint" style="margin-top:9px">${t.saving}% sparen</div>`:''}<div class="featureList"><div class="feature">✓ Accounts: ${t.accounts===null?'∞':t.accounts}</div><div class="feature">✓ Alarme je Account: ${t.alarms===null?'∞':t.alarms}</div><div class="feature">✓ Events: ${t.events===null?'∞':t.events}</div></div><button class="btn ${t.id===current?'ghost':'primary'}" ${t.id===current?'disabled':''} onclick="selectTier('${t.id}')">${t.id===current?'Aktueller Plan':`Plan auswählen`}</button></article>`).join('')}</div><div class="small muted" style="margin-top:12px">Effektiver Monatswert bei jährlicher Zahlung: ${Object.values(TIERS).filter(t=>t.year).map(t=>`${t.label}: ${money(t.year/12)}`).join(' · ')}</div></div></div>`}
function selectTier(id){if(!TIERS[id])return;state.tierId=id;persist();closeModal();render();toast(`Plan ${TIERS[id].label} ausgewählt. Store-Kauf wird separat verifiziert.`)}
function openBackup(){document.getElementById('modalRoot').innerHTML=`<div class="modalWrap"><div class="modal" role="dialog" aria-modal="true"><div class="modalHead"><h3>Backup & Wiederherstellung</h3><button class="close" onclick="closeModal()">×</button></div><p class="muted small">JSON-Backup enthält Accounts, Alarme, aktive Accountauswahl, Teststatus, Notification-Präferenzen, Schema- und Backupversion.</p><div class="actions"><button class="btn primary" onclick="exportBackup()">Backup exportieren</button><label class="btn secondary" style="display:inline-flex;align-items:center;justify-content:center">Backup importieren<input id="backupFile" type="file" accept="application/json,.json" style="display:none" onchange="importBackup(event)"></label></div></div></div>`}
function backupPayload(){return{format:BACKUP_FORMAT,version:BACKUP_VERSION,exportedAt:iso(now()),schemaVersion:state.schemaVersion,data:{accounts:state.accounts,alarms:state.alarms,activeAccountId:state.activeAccountId,tierId:state.tierId,testConfirmedAt:state.testConfirmedAt,preferences:state.preferences}}}
function exportBackup(){const blob=new Blob([JSON.stringify(backupPayload(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`tgm-alarm-center-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast('Backup exportiert.')}
function validateBackup(x){if(!x||typeof x!=='object'||x.format!==BACKUP_FORMAT||x.version!==BACKUP_VERSION||x.schemaVersion!==SCHEMA_VERSION||!x.data||typeof x.data!=='object')throw new Error('Backupformat oder Version ungültig.');const d=x.data;if(!Array.isArray(d.accounts)||!Array.isArray(d.alarms)||!('activeAccountId'in d)||!d.preferences)throw new Error('Backupstruktur unvollständig.');const ids=new Set();for(const a of d.accounts){if(typeof a?.id!=='string'||ids.has(a.id)||typeof a.name!=='string'||typeof a.color!=='string')throw new Error('Accountdaten ungültig.');ids.add(a.id)}for(const a of d.alarms){if(typeof a?.id!=='string'||ids.has(`alarm:${a.id}`)||typeof a.title!=='string'||!ids.has(a.accountId)||typeof a.eventAt!=='number'||!['bubble','gw','custom'].includes(a.type)||!['once','daily','gw5d'].includes(a.repeat)||!Array.isArray(a.warnings))throw new Error('Alarmdaten ungültig.');ids.add(`alarm:${a.id}`)}if(d.activeAccountId!==null&&!ids.has(d.activeAccountId))throw new Error('Aktiver Account ungültig.');const p={...DEFAULT_PREFS,...d.preferences};if(!SOUNDS[p.sound])throw new Error('Notification-Präferenzen ungültig.');return normalize({schemaVersion:SCHEMA_VERSION,accounts:d.accounts,alarms:d.alarms,activeAccountId:d.activeAccountId,tierId:TIERS[d.tierId]?d.tierId:'free',testConfirmedAt:d.testConfirmedAt||null,preferences:p})}
async function importBackup(e){const f=e.target.files?.[0];if(!f)return;try{const parsed=JSON.parse(await f.text());const candidate=validateBackup(parsed);state=candidate;persist();rescheduleWeb();closeModal();render();toast('Backup vollständig wiederhergestellt.')}catch(err){toast(err.message||'Backup konnte nicht importiert werden.')}}
function runLocalTest(){if(!('Notification'in window))return toast('Lokaler Browser-Benachrichtigungstest nicht verfügbar.');if(Notification.permission==='granted'){const n=new Notification('TGM ALARM CENTER · Test',{body:'Lokale Benachrichtigung erfolgreich ausgelöst.',tag:`tgm-test-${Date.now()}`});n.onclick=()=>window.focus();state.testConfirmedAt=iso(now());persist();render();toast('Lokaler Test bestätigt.')}else if(Notification.permission==='default'){requestBrowserPermission().then?.(()=>{})}else toast('Benachrichtigungen sind verweigert. Öffne die Systemeinstellungen des Browsers.')}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function startTicker(){clearInterval(startTicker.i);startTicker.i=setInterval(()=>{const c=document.getElementById('countdown'),cl=document.getElementById('clock');if(cl)cl.textContent=localFormat(now());if(c){const n=nextRelevant();c.textContent=n?countdownText(n.at):'—'}},1000)}
window.setView=setView;window.openAccount=openAccount;window.saveAccount=saveAccount;window.selectAccount=selectAccount;window.openEditor=openEditor;window.selectTemplate=selectTemplate;window.saveAlarm=saveAlarm;window.toggleAlarm=toggleAlarm;window.duplicateAlarm=duplicateAlarm;window.deleteAlarm=deleteAlarm;window.openNotifications=openNotifications;window.saveNotifications=saveNotifications;window.requestBrowserPermission=requestBrowserPermission;window.previewSound=previewSound;window.openPlans=openPlans;window.selectTier=selectTier;window.openBackup=openBackup;window.exportBackup=exportBackup;window.importBackup=importBackup;window.runLocalTest=runLocalTest;window.closeModal=closeModal;window.markCompleted=markCompleted;window.syncTemplateFields=syncTemplateFields;
render();rescheduleWeb();startTicker();
window.addEventListener('visibilitychange',()=>{if(!document.hidden)rescheduleWeb()});window.addEventListener('focus',()=>rescheduleWeb());window.addEventListener('storage',()=>{state=load();rescheduleWeb();render()});
</script>
